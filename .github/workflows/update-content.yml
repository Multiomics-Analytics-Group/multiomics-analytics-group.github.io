name: Update publications, tools and courses

# Regenerates _data/auto_*.json and public/auto/** from the link lists in
# _content/*.yml.
#
# master is protected ("changes must be made through a pull request"), so the
# workflow never pushes to master directly:
#   * pull_request       -> generates the content and commits it to the PR
#                           branch, so it is merged together with the change.
#   * schedule / manual  -> generates the content and opens (or updates) a PR
#   * push to master        named "Update auto-generated site content".

on:
  pull_request:
    paths:
      - "_content/**"
      - "scripts/update_site_content.py"
      - "scripts/requirements.txt"
      - ".github/workflows/update-content.yml"
  push:
    branches: [master]
    paths:
      - "_content/**"
      - "scripts/update_site_content.py"
  schedule:
    # 1st of every month: re-fetch everything (new preprint versions, README updates)
    - cron: "17 4 1 * *"
  workflow_dispatch:
    inputs:
      refresh:
        description: "Re-fetch every entry (ignore cached data)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-content-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}

      - name: Check out master
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate content
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # higher GitHub API rate limit
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.refresh }}" = "true" ]; then
            ARGS="$ARGS --refresh"
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ARGS="$ARGS --strict"   # fail the PR check if a link cannot be resolved
          fi
          python scripts/update_site_content.py $ARGS

      - name: Show generated changes
        run: |
          git add -A _data public/auto
          git status --short _data public/auto
          git diff --cached --stat

      # ---- Pull requests: commit the generated files to the PR branch ----
      - name: Commit to PR branch
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --cached --quiet; then
            echo "Generated content is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update auto-generated publications, tools and courses"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload preview (pull requests from forks)
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@v4
        with:
          name: generated-content
          path: |
            _data/auto_*.json
            public/auto/

      # ---- master (schedule / manual / safety net): open a pull request ----
      - name: Open pull request with updated content
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/update-site-content
          delete-branch: true
          add-paths: |
            _data/auto_*.json
            public/auto/**
          commit-message: "Update auto-generated publications, tools and courses"
          title: "Update auto-generated site content"
          body: |
            Automatic update of `_data/auto_*.json` and `public/auto/` from the
            link lists in `_content/`, generated by the
            *Update publications, tools and courses* workflow.

            Review the changes and merge to publish them on the website.
