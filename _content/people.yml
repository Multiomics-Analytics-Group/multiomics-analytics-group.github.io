# Team members shown on the People page.
#
# Two sections: `active` (current team) and `alumni`. People are shown in the
# order of this file, grouped by `team` (groups appear in order of first use).
#
# Fields:
#   name, surname        required (surname may be empty)
#   position             text, or a list for several roles
#   photo                repo path (put originals in public/assets/people/) or URL.
#                        Any size/format: the workflow crops it to a square,
#                        resizes it and stores it in public/auto/people/.
#                        Without a photo the card shows the person's initials.
#   team                 optional group heading, e.g. "Data Science Platform"
#   email, website, github, linkedin, orcid, scholar, bluesky, x   optional links
#   years                optional, mainly for alumni (e.g. "2021-2024")
#   now                  optional, alumni: current position
#   photo_focus          optional crop position for tall photos: 0 = top, 0.5 = centre (default 0.25)
#   photo_zoom           optional, > 1 crops tighter around the face (e.g. 1.3)
#   hidden               true = keep the entry but do not show it

