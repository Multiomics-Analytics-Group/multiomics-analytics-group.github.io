# Courses shown on the Education page (newest first, sorted automatically by date).
#
# Add one entry per course. Only `url` is required: a GitHub repository URL
# (preferred) or a website. From GitHub the CI workflow reads the README title,
# its opening paragraph(s), the bullets under an "Objectives"/"Learning
# outcomes" heading, the "Keywords" section and the first suitable image
# (institutional logo rows and badges are skipped; if nothing suitable is
# found the GitHub preview card is used).
#
# Optional fields override what is fetched automatically:
#   title, summary (Markdown), highlights (list of objectives),
#   image (URL or repo path), keywords (list), note,
#   date (YYYY-MM-DD; default = repository creation date), hidden (true/false)

- url: https://github.com/Multiomics-Analytics-Group/course_multi-omics_analysis

- url: https://github.com/Multiomics-Analytics-Group/course_protein_language_modeling
  # kept from the previous hand-written entry (not in the README)
  title: Protein Language Models
  image: https://raw.githubusercontent.com/Multiomics-Analytics-Group/course_protein_language_modeling/main/img/nb_logo.png
  highlights:
    - Gain a comprehensive understanding of the synergy between language models and protein data
    - Equip students with the skills to leverage pre-trained models and fine-tuning for bioinformatics applications
    - Explore cutting-edge use cases and discover how protein language models are shaping the future of molecular biology
    - Understand the current limitations of the field and be prepared to tackle bioinformatics challenges

