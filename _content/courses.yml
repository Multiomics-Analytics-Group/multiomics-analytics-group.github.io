# Courses shown on the Education page (newest first, sorted automatically by date).
#
# Add one entry per course. Only `url` is required: a GitHub repository URL
# (preferred) or a website. From GitHub the CI workflow reads the README title,
# its opening paragraph(s), the bullets under an "Objectives"/"Learning
# outcomes" heading, the "Keywords" section and the first suitable image
# (institutional logo rows and badges are skipped; if nothing suitable is
# found the GitHub preview card is used).
#
# Optional fields override what is fetched automatically:
#   title, summary (Markdown), highlights (list of objectives),
#   image (URL or repo path), keywords (list), note,
#   date (YYYY-MM-DD; default = repository creation date), hidden (true/false),
#   themes (list of home-page themes, ids from _data/home_themes.yml)

- url: https://github.com/Multiomics-Analytics-Group/course_multi-omics_analysis
  themes: [training]

- url: https://github.com/Multiomics-Analytics-Group/course_protein_language_modeling
  themes: [training, generative]
  summary: >-
    An up-to-date course at the intersection of language models and the complex world of proteins.
    It provides an overview of the current state of the art of protein language models, which are
    changing research, discovery and innovation in molecular biology.
  # kept from the previous hand-written entry (not in the README)
  title: Protein Language Models
  image: https://raw.githubusercontent.com/Multiomics-Analytics-Group/course_protein_language_modeling/main/img/nb_logo.png
  highlights:
    - Gain a comprehensive understanding of the synergy between language models and protein data
    - Equip students with the skills to leverage pre-trained models and fine-tuning for bioinformatics applications
    - Explore cutting-edge use cases and discover how protein language models are shaping the future of molecular biology
    - Understand the current limitations of the field and be prepared to tackle bioinformatics challenges

- url: https://github.com/Multiomics-Analytics-Group/course_graph_machine_learning
  themes: [training, graph-ml]
  title: Graph Machine Learning (DTU 27666 AI-guided Protein Science)
  summary: >-
    The graph machine learning module of the DTU course 27666 *AI-guided Protein Science*. It
    introduces graph biology and how to turn biological data into graphs, graph machine learning
    tasks and shallow embeddings (Node2Vec, DeepWalk) with PyTorch Geometric, and graph neural
    networks for node- and graph-level prediction. Every session comes with a hands-on Google Colab notebook.
  highlights:
    - Represent biological data as graphs
    - Learn node embeddings with Node2Vec and DeepWalk in PyTorch Geometric
    - Build graph neural networks for node and graph prediction tasks

- url: https://github.com/Multiomics-Analytics-Group/networks_to_study_microbes
  themes: [training, microbes]
  # kept from the previous hand-written entry (not in the README)
  title: Networks to Study Microbes
  image: https://raw.githubusercontent.com/Multiomics-Analytics-Group/networks_to_study_microbes/main/figures/netmicrobes.png
  highlights:
    - Use multiple data sources for studying microbes in different biological contexts
    - Build networks, visualize and analyse them using different tools
    - Use Python to extract, transform and analyse different data structures
  note: Some of the course content is in Spanish, but we are working on an English version.
